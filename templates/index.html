<!DOCTYPE html>
<html>
<head>
    <title>College Helpdesk Bot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="chat-container">
    <h2>🎓 College Helpdesk Bot 🤖</h2>

    <div id="chat-box"></div>

    <div class="quick-buttons">
        <button onclick="quickMsg('fees')">Fees</button>
        <button onclick="quickMsg('no dues')">No Dues</button>
        <button onclick="quickMsg('exam')">Exams</button>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Ask something...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
function appendMessage(sender, text) {
    let box = document.getElementById("chat-box");
    let msg = `<div class="${sender}">${text}</div>`;
    box.innerHTML += msg;
    box.scrollTop = box.scrollHeight;
}

function sendMessage() {
    let inputField = document.getElementById("user-input");
    let input = inputField.value;

    if (!input) return;

    appendMessage("user", input);

    fetch("/get", {
        method: "POST",
        body: JSON.stringify({message: input}),
        headers: {"Content-Type": "application/json"}
    })
    .then(res => res.json())
    .then(data => {
        appendMessage("bot", data.reply);
    });

    inputField.value = "";
}

function quickMsg(text) {
    document.getElementById("user-input").value = text;
    sendMessage();
}
</script>

</body>
</html>
